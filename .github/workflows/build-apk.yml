name: Build & Release NueTify Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download NueTify launcher icon
        run: |
          curl -sSL "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRV5isL7Sh5nl63FMY7WQDyzB8kQ9TI5S4Di3y6hP--L5t6RQHfGVQpueU&s=10" -o /tmp/icon_raw
          for spec in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
            d="${spec%%:*}"
            sz="${spec##*:}"
            mkdir -p "android/app/src/main/res/$d"
            ffmpeg -y -loglevel error -i /tmp/icon_raw -vf "scale=${sz}:${sz}:force_original_aspect_ratio=increase,crop=${sz}:${sz}" "android/app/src/main/res/$d/ic_launcher.png"
          done
  
      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/nuetify-release.jks \
            -alias nuetify \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nuetify123456 -keypass nuetify123456 \
            -dname "CN=NueTify, OU=Engineering, O=PT Nueva Group, L=Indonesia, C=ID"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Signed Release APK
        working-directory: android
        run: |
          gradle assembleRelease \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.0.${{ github.run_number }}

      - name: Prepare APK Artifact
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk NueTify.apk
          ls -lh NueTify.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NueTify v1.0.${{ github.run_number }}
          body: |
            Rilis otomatis aplikasi Android **NueTify** (Dikembangkan oleh Tim PT Nueva Group).
            - Pemutaran musik latar belakang 24 jam dengan Foreground Service
            - Notifikasi lockscreen dengan kontrol Like, Previous, Play/Pause, Next, dan Repeat
          files: NueTify.apk
          make_latest: true
