name: Build & Release NueTify Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download & Convert NueTify Launcher Icon
        run: |
          curl -fsSL "https://i.ibb.co.com/zWnqqSFM/Proyek-Baru-597-FE9-F6-D7.png" -o /tmp/nuetify_logo.jpg
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
          python3 - << 'EOF'
          import os
          from PIL import Image, ImageOps
          img = Image.open("/tmp/nuetify_logo.jpg").convert("RGBA")

          targets = [
              ("mipmap-mdpi", 48),
              ("mipmap-hdpi", 72),
              ("mipmap-xhdpi", 96),
              ("mipmap-xxhdpi", 144),
              ("mipmap-xxxhdpi", 192),
          ]
          for folder, sz in targets:
              out_dir = os.path.join("android", "app", "src", "main", "res", folder)
              os.makedirs(out_dir, exist_ok=True)
              ImageOps.fit(img, (sz, sz), Image.LANCZOS).save(os.path.join(out_dir, "ic_launcher.png"), format="PNG")
          EOF
  
      - name: Restore Fixed Release Keystore
        run: |
                base64 -d android/app/nuetify-release.jks.b64 > android/app/nuetify-release.jks       

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Signed Release APK
        working-directory: android
        run: |
          gradle assembleRelease \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.0.${{ github.run_number }}

      - name: Prepare APK Artifact
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk NueTify.apk
          ls -lh NueTify.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NueTify v1.0.${{ github.run_number }}
          body: |
            Rilis otomatis aplikasi Android **NueTify** (Dikembangkan oleh Tim PT Nueva Group).
            - Pemutaran musik latar belakang 24 jam dengan Foreground Service
            - Notifikasi lockscreen dengan kontrol Like, Previous, Play/Pause, Next, dan Repeat
          files: NueTify.apk
          make_latest: true
