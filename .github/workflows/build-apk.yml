name: Build & Release NueTify Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate NueTify N-Circle Launcher Icon
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
          python3 - << 'EOF'
          import os
          from PIL import Image, ImageDraw

          S = 1024
          mask = Image.new("L", (S, S), 0)
          ImageDraw.Draw(mask).ellipse((0, 0, S - 1, S - 1), fill=255)

          bg = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          ImageDraw.Draw(bg).ellipse((0, 0, S - 1, S - 1), fill=(0, 0, 0, 255))

          fg = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          d = ImageDraw.Draw(fg)

          lx1, lx2 = int(0.30 * S), int(0.375 * S)
          ty, by = int(0.27 * S), int(0.73 * S)
          d.rectangle((lx1, ty, lx2, by), fill=(255, 255, 255, 255))

          w = int(0.075 * S)
          d.polygon([
              (lx1, ty),
              (lx2, ty),
              (S, int(S * 1.12)),
              (S - w, int(S * 1.12))
          ], fill=(255, 255, 255, 255))

          rx1, rx2 = int(0.625 * S), int(0.70 * S)
          r_top, r_bot = int(0.27 * S), int(0.60 * S)
          for y in range(r_top, r_bot + 1):
              alpha = int(255 * (1.0 - (y - r_top) / float(r_bot - r_top)))
              d.line((rx1, y, rx2, y), fill=(255, 255, 255, alpha))

          fg_clipped = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          fg_clipped.paste(fg, (0, 0), mask)
          icon = Image.alpha_composite(bg, fg_clipped)

          targets = [
              ("mipmap-mdpi", 48),
              ("mipmap-hdpi", 72),
              ("mipmap-xhdpi", 96),
              ("mipmap-xxhdpi", 144),
              ("mipmap-xxxhdpi", 192),
          ]
          for folder, sz in targets:
              out_dir = os.path.join("android", "app", "src", "main", "res", folder)
              os.makedirs(out_dir, exist_ok=True)
              icon.resize((sz, sz), Image.LANCZOS).save(os.path.join(out_dir, "ic_launcher.png"))
          EOF
  
      - name: Restore Fixed Release Keystore
        run: |
                base64 -d android/app/nuetify-release.jks.b64 > android/app/nuetify-release.jks       

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Signed Release APK
        working-directory: android
        run: |
          gradle assembleRelease \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.0.${{ github.run_number }}

      - name: Prepare APK Artifact
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk NueTify.apk
          ls -lh NueTify.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NueTify v1.0.${{ github.run_number }}
          body: |
            Rilis otomatis aplikasi Android **NueTify** (Dikembangkan oleh Tim PT Nueva Group).
            - Pemutaran musik latar belakang 24 jam dengan Foreground Service
            - Notifikasi lockscreen dengan kontrol Like, Previous, Play/Pause, Next, dan Repeat
          files: NueTify.apk
          make_latest: true
