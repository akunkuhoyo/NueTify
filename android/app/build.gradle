plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
def appVerCode = project.hasProperty('appVersionCode') ? project.property('appVersionCode').toString().toInteger() : 1
def appVerName = project.hasProperty('appVersionName') ? project.property('appVersionName').toString() : '1.0.0'

android {
    namespace 'com.ptnuevagroup.nuetify'
    compileSdk 35

    defaultConfig {
        applicationId "com.ptnuevagroup.nuetify"
        minSdk 24
        targetSdk 35
        versionCode appVerCode
        versionName appVerName
    }

    signingConfigs {
        release {
            storeFile file("nuetify-release.jks")
            storePassword System.getenv("KEYSTORE_PASS") ?: "nuetify123456"
            keyAlias System.getenv("KEY_ALIAS") ?: "nuetify"
            keyPassword System.getenv("KEY_PASS") ?: "nuetify123456"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.media:media:1.7.0'
}
